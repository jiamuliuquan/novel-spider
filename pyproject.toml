[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-spider"
version = "1.1.0"
description = "A configurable novel crawler for static HTML sites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
novel-spider = "novel_spider.cli:main"

[tool.setuptools.packages.find]
include = ["novel_spider*"]

